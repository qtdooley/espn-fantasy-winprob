name: Daily ESPN pull

on:
  schedule:
    - cron: "17 12 * * *"   # 12:17 UTC = 5:17am PDT / 4:17am PST, after ESPN's overnight stat corrections
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the job commit the CSVs back to the repo

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Los_Angeles   # game times in the CSVs come out in Pacific time
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull ESPN data and compute win probabilities
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_YEAR: ${{ vars.ESPN_YEAR }}
          SD_PCT: ${{ vars.SD_PCT }}
          SD_BASIS: ${{ vars.SD_BASIS }}
          MIN_FPPG: ${{ vars.MIN_FPPG }}
        run: python pull.py

            - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Daily ESPN data $(date +%F)"
          # If the repo changed during the run (e.g. you uploaded a file), replay this
          # commit on top of it; for any CSV changed on both sides, keep this run's data.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push && exit 0
            sleep 5
          done
          exit 1
